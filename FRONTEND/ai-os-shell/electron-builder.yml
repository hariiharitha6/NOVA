appId: com.nova.desktop
productName: NOVA
copyright: Copyright © 2026 NOVA

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - resources/**/*

asarUnpack:
  - node_modules/sherpa-onnx/**/*
  - resources/models/**/*

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/nova.ico
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: NOVA
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: resources/icons/nova.ico
  uninstallerIcon: resources/icons/nova.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.utilities

linux:
  target: AppImage
  category: Utility
