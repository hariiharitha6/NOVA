<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6F8"/>
      <stop offset="0.45" stop-color="#C9CFD8"/>
      <stop offset="1" stop-color="#8F97A2"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#D84A50"/>
      <stop offset="0.55" stop-color="#A92B31"/>
      <stop offset="1" stop-color="#8E2026"/>
    </linearGradient>
    <linearGradient id="obsidian" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2C3037"/>
      <stop offset="0.55" stop-color="#191C21"/>
      <stop offset="1" stop-color="#101217"/>
    </linearGradient>
    <linearGradient id="rimSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9C0C9"/>
      <stop offset="0.4" stop-color="#6B7280"/>
      <stop offset="1" stop-color="#4A505A"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.18" r="1.1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redglow" cx="0.5" cy="0.86" r="0.65">
      <stop offset="0" stop-color="#B92D32" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#B92D32" stop-opacity="0"/>
    </radialGradient>
    <g id="ajcore">
      <path d="M122 40 L180 168 C186 208 154 224 118 224 C84 224 60 208 58 180"
            stroke="url(#crimson)" stroke-width="34" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M122 40 L38 158" stroke="url(#silver)" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M66 108 L144 102" stroke="url(#silver)" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Windows application icon: obsidian squircle + AJ (no wordmark) -->
  <rect x="4" y="4" width="248" height="248" rx="62" ry="62" fill="url(#obsidian)" stroke="none"/>
  <!-- metallic seam -->
  <rect x="9" y="9" width="238" height="238" rx="57" ry="57" fill="none" stroke="url(#rimSilver)" stroke-width="1.75" opacity="0.55"/>
  <!-- faint crimson rising at the base -->
  <ellipse cx="128" cy="196" rx="96" ry="58" fill="url(#redglow)"/>
  <!-- matte top sheen -->
  <rect x="4" y="4" width="248" height="248" rx="62" ry="62" fill="url(#sheen)"/>
  <!-- AJ monogram -->
  <g transform="translate(128 130) scale(0.76) translate(-111.5 -132)">
    <use href="#ajcore"/>
  </g>
</svg>